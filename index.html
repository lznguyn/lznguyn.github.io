<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK Study - Learn Chinese</title>
  <meta name="description" content="Learn Chinese at your own pace with HSK levels, flashcards with pinyin tones, and quizzes.">
  <link rel="stylesheet" href="src/presentation/styles/index.css">
</head>

<body>
  <div class="app-container">
    <!-- Navigation -->
    <header class="app-navbar">
      <div class="nav-content">
        <button class="app-title" id="btnHome" type="button" aria-label="Go to home">
          <span class="app-title-zh" lang="zh-CN">汉语学习</span>
          <span class="app-title-sub">HSK Study</span>
        </button>
        <nav class="nav-links" aria-label="Main">
          <button class="btn-text" id="btnLevels" type="button">Levels</button>
          <button class="btn-text" id="btnProgress" type="button">My Progress</button>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <div id="app-message" class="app-message" role="status" hidden></div>

      <!-- Level Selection View -->
      <div id="level-container" class="view-container"></div>

      <!-- Lessons Container -->
      <div id="lessons-container" class="view-container" style="display: none;"></div>

      <!-- Lesson View -->
      <div id="lesson-container" class="view-container" style="display: none;"></div>

      <!-- Quiz View -->
      <div id="quiz-container" class="view-container" style="display: none;"></div>

      <!-- Progress Tracker -->
      <div id="progress-container" class="view-container" style="display: none;"></div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>HSK Study &mdash; learn a little every day.</p>
    </footer>
  </div>

  <script type="module" src="src/presentation/app.js"></script>
</body>

</html>
